<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>החלפת תנועות - נווה</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Nave English Hub - shared style. Clean, minimal, phone first, scales up for desktop. */
:root{--ink:#12263a;--mute:#64748b;--line:#e2e8f0;--bg:#f6f9fc;--blue:#0369a1;--blue-l:#e6f2fa;--ok:#15803d;--ok-l:#dcfce7;--bad:#b91c1c;--bad-l:#fee2e2;--sun:#f5b700}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Rubik',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;touch-action:manipulation}
button,select,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.en,.en2,.pw{font-family:'Fredoka','Rubik',sans-serif;direction:ltr}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Page frame */
.wrap{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap.plain{padding-bottom:40px}
h1{font-size:1.7rem;margin:6px 0 16px}
h3{font-size:1rem;color:var(--mute);font-weight:500;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h3 a{color:var(--blue);font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.back,.teach{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;padding:0 14px;font-weight:500;color:var(--blue);font-size:.9rem;white-space:nowrap}
.teach{color:var(--mute)}
#voice{flex:1;min-width:0;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;direction:ltr;color:var(--ink)}

/* Home and index lists */
.hero{display:block;width:100%;border:0;border-radius:22px;background:var(--blue);color:#fff;padding:22px;font-size:1.5rem;font-weight:700;text-align:start}
.hero small{display:block;font-size:.9rem;font-weight:400;opacity:.85;margin-top:4px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:10px;font-size:1.05rem;font-weight:500;min-height:60px}
.item small{color:var(--mute);font-weight:400;font-size:.9rem;text-align:end}
.tag{background:var(--sun);color:#3d2e00;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700;margin-inline-start:8px}
.empty{color:var(--mute);padding:12px 4px}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px 20px;text-align:center;margin-top:12px}
.cnt{color:var(--mute);font-size:.9rem;font-weight:500}
.emo{font-size:4.2rem;line-height:1.2;margin-top:8px}
.card .en{font-size:3.6rem;font-weight:600;color:var(--blue);margin:8px 0 2px;overflow-wrap:anywhere}
.he{font-size:1.5rem;font-weight:500;margin:6px 0 10px}
.he.big{font-size:2.2rem;font-weight:700}
.sent{margin-top:14px;color:var(--mute);direction:ltr;font-size:1.05rem}
.snd{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);background:#fff;font-size:1.4rem;margin-top:8px}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:1.15rem;font-weight:700;margin-top:12px}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--blue-l);color:var(--blue)}
.btn:disabled{opacity:.4}
.lnk{display:block;margin:12px auto 0;border:0;background:none;color:var(--mute);font-size:.95rem;min-height:44px;padding:0 20px}
.lnk:disabled{opacity:.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.opt{min-height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:1.1rem;font-weight:500;padding:6px;color:var(--ink)}
.opt.ok{background:var(--ok-l);border-color:var(--ok)}
.opt.bad{background:var(--bad-l);border-color:var(--bad)}
.ans{width:100%;min-height:60px;margin:16px 0 6px;font:600 1.7rem 'Fredoka',sans-serif;text-align:center;direction:ltr;border:2px solid var(--blue);border-radius:16px}
.fb{min-height:1.5em;font-weight:500;color:var(--mute)}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.row2{display:flex;align-items:center;justify-content:space-between;margin:0 2px}
.sw{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--mute);min-height:44px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw span{width:44px;height:26px;border-radius:99px;background:#cbd5e1;position:relative;transition:background .15s}
.sw span::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{inset-inline-start:21px}
.sw input:focus-visible+span{outline:3px solid var(--sun)}
.tap{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;margin-top:6px;width:100%;font:inherit;color:inherit}
.hint{color:#94a3b8;font-size:.85rem;margin-top:14px;min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px;direction:ltr}
.chips span{background:var(--blue-l);color:var(--blue);border-radius:10px;padding:6px 12px;font-weight:600;font-family:'Fredoka',sans-serif}

/* Bottom tabs (phone thumb reach) */
.tabs{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:4}
.tabs div{display:flex;max-width:560px;margin:0 auto;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:14px;min-height:54px;font-size:.8rem;color:var(--mute);font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button b{font-size:1.2rem}
.tabs button[aria-selected=true]{background:var(--blue-l);color:var(--blue)}

/* Print chooser */
.chooser{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.chooser h2{font-size:1.1rem}
.chooser p{color:var(--mute);font-size:.9rem;margin:2px 0 12px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:48px;font-size:.85rem;cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.pick .en2{font-weight:600;font-size:1.1rem;color:var(--blue)}
.pick span:last-child{color:var(--mute);margin-inline-start:auto;font-size:.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{margin-top:0;min-height:48px;font-size:.95rem}

/* The paper test. cqw = percent of the sheet width, so it looks the same on screen and on paper */
.paper{container-type:inline-size;margin-top:18px}
.sheet{--rh:9;background:#fff;border:.7cqw double #12263a;border-radius:2.5cqw;min-height:calc(100cqw*1.414);padding:6cqw 7cqw;display:flex;flex-direction:column;color:#000;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.sheet h2{font-size:6.5cqw;text-align:center}
.sheet .sub{text-align:center;font-size:3.4cqw;margin:1cqw 0 4cqw;border-bottom:.4cqw solid #000;padding-bottom:3cqw}
.fields{display:flex;gap:5cqw;font-size:3.6cqw;font-weight:700;margin-bottom:3cqw}
.fields div{flex:1;display:flex;align-items:flex-end;gap:2cqw;white-space:nowrap}
.fields i{flex:1;border-bottom:.35cqw solid #000;height:1em}
.inst{font-size:3.2cqw;margin-bottom:3cqw}
.rows{flex:1}
.r{display:flex;align-items:flex-end;gap:2.5cqw;height:calc(var(--rh)*1cqw);font-size:calc(var(--rh)*.5cqw)}
.r b{width:6cqw;font-weight:500;font-size:calc(var(--rh)*.38cqw);padding-bottom:.6cqw}
.pw{width:26cqw;text-align:right;font-weight:600}
.ln{flex:1;border-bottom:.35cqw solid #000;min-height:1.3em;font-size:calc(var(--rh)*.43cqw);font-weight:700;padding:0 2cqw;font-family:'Rubik',sans-serif}
.score{font-size:3.6cqw;font-weight:700;padding-top:2cqw}

@media (hover:hover){.btn:hover{filter:brightness(1.08)}.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}.item:hover{border-color:var(--blue)}.back:hover,.teach:hover{background:var(--blue-l)}.tabs button:hover{background:var(--blue-l)}}
@media (max-width:360px){.card .en{font-size:2.9rem}.opt{font-size:1rem}.tabs button{font-size:.72rem}}
@media (min-width:760px){.wrap,.bar,.tabs div{max-width:640px}h1{font-size:2rem}.card{padding:40px 28px}.card .en{font-size:4.4rem}.tap{min-height:280px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .bar,.tabs,.chooser,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .paper{margin:0}
  .sheet{box-shadow:none;min-height:calc(100cqw*1.414 - 2mm)}
}

/* Vowel pages */
.slot{display:flex;justify-content:center;gap:.12em;font-size:4.6rem;font-weight:600;line-height:1.2;margin:6px 0}
.slot .gap{min-width:.7em;border-bottom:4px dashed #cbd5e1;color:#cbd5e1}
.slot .gap.ok{color:var(--blue);border-bottom:4px solid var(--blue)}
.slot .gap.no{color:var(--bad);border-bottom:4px solid var(--bad)}
.vows{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.opt.vb{font:600 1.9rem 'Fredoka',sans-serif;min-height:68px}
.opt.vb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.chip{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font:600 1.05rem 'Fredoka',sans-serif;color:var(--ink)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.center{text-align:center}
@media (min-width:760px){.slot{font-size:5.6rem}.bases{grid-template-columns:repeat(6,1fr)}}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const h = (tag, props, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === false || v == null) continue;
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
    return e;
  };

  /* ---------- Voice: female English by default, dropdown to change, choice remembered ---------- */
  const PREFER = ['samantha', 'karen', 'zira', 'aria', 'jenny', 'google us english', 'victoria', 'female'];
  const Voice = {
    list: [], cur: null, select: null,
    load() {
      if (!('speechSynthesis' in window)) return;
      this.list = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
      if (!this.list.length || !this.select) return;
      const saved = store.get('nave-voice', '');
      let best = this.list.findIndex(v => v.name === saved);
      if (best < 0) {
        let rank = 99; best = 0;
        this.list.forEach((v, i) => {
          const r = PREFER.findIndex(p => v.name.toLowerCase().includes(p));
          if (r >= 0 && r < rank) { rank = r; best = i; }
        });
      }
      this.select.replaceChildren(...this.list.map((v, i) => h('option', { value: String(i) }, v.name)));
      this.select.value = String(best); this.cur = this.list[best];
    },
    pick() { this.cur = this.list[this.select.value]; if (this.cur) store.set('nave-voice', this.cur.name); this.say('Hello Nave'); },
    say(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.8;
      if (this.cur) u.voice = this.cur;
      speechSynthesis.speak(u);
    }
  };

  const VOW = ['a', 'e', 'i', 'o', 'u'];
  function frame(cfg) {
    const voiceSel = h('select', { id: 'voice', 'aria-label': 'בחירת קול', onchange: () => Voice.pick() });
    Voice.select = voiceSel;
    const stage = h('main', { class: 'wrap' }), tabs = h('nav', { class: 'tabs', 'aria-label': 'שלבים' });
    document.getElementById('app').replaceChildren(
      h('div', { class: 'bar' }, h('a', { class: 'back', href: cfg.back || 'index.html' }, '→ חזרה'), voiceSel), stage, tabs);
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => Voice.load();
    Voice.load();
    return { stage, tabs };
  }
  const spk = text => h('button', { class: 'snd', 'aria-label': 'השמע', onclick: () => Voice.say(text) }, '🔊');
  const letters = (a, mid, b, cls) => h('div', { class: 'slot en', dir: 'ltr' }, h('span', {}, a), h('span', { class: 'gap ' + (cls || '') }, mid), h('span', {}, b));

  /* Swap the vowel: h _ t -> press a, e, i, o, u and see if it is a real word */
  function swap(cfg) {
    const B = cfg.bases, { stage } = frame(cfg);
    let bi = 0, vow = '';
    const go = i => { bi = (i + B.length) % B.length; vow = ''; render(); };
    function render() {
      const b = B[bi], w = vow ? b.words[vow] : null;
      const mid = vow || '_';
      const body = [letters(b.s, mid, b.e, vow ? (w ? 'ok' : 'no') : '')];
      if (!vow) body.push(h('div', { class: 'hint' }, 'בחרו תנועה'));
      else if (w) body.push(w.icon ? h('div', { class: 'emo' }, w.icon) : null, h('div', { class: 'he' }, w.he), spk(w.en));
      else body.push(h('div', { class: 'fb', style: 'margin-top:14px' }, 'אין מילה כזו באנגלית'));
      const vows = h('div', { class: 'vows', dir: 'ltr' }, VOW.map(v => h('button', {
        class: 'opt vb' + (v === vow ? ' on' : ''), 'aria-pressed': String(v === vow), onclick: () => { vow = v; render(); }
      }, v)));
      stage.replaceChildren(
        h('div', { class: 'row2' },
          h('button', { class: 'back', onclick: () => go(bi - 1) }, 'הקודם'),
          h('span', { class: 'cnt' }, `${bi + 1} / ${B.length}`),
          h('button', { class: 'back', onclick: () => go(bi + 1) }, 'הבא')),
        h('div', { class: 'card' }, body), vows,
        h('h3', {}, 'בחרו מילה'),
        h('div', { class: 'bases', dir: 'ltr' }, B.map((x, i) => h('button', { class: 'chip' + (i === bi ? ' on' : ''), onclick: () => go(i) }, `${x.s}_${x.e}`))));
    }
    render();
  }


swap({
  back: 'index.html',
  bases: [
    { s: 'h', e: 't', words: {
      a: { en: 'hat', he: 'כובע', icon: '🎩' },
      i: { en: 'hit', he: 'להכות', icon: '🥊' },
      o: { en: 'hot', he: 'חם', icon: '🔥' },
      u: { en: 'hut', he: 'בקתה', icon: '🛖' } } },
    { s: 'b', e: 'g', words: {
      a: { en: 'bag', he: 'תיק', icon: '🎒' },
      e: { en: 'beg', he: 'להתחנן', icon: '🙏' },
      i: { en: 'big', he: 'גדול', icon: '🐘' },
      u: { en: 'bug', he: 'חרק', icon: '🐛' } } },
    { s: 'p', e: 't', words: {
      a: { en: 'pat', he: 'לטפוח', icon: '🫳' },
      e: { en: 'pet', he: 'חיית מחמד', icon: '🐶' },
      i: { en: 'pit', he: 'בור', icon: '🕳️' },
      o: { en: 'pot', he: 'סיר', icon: '🍲' } } },
    { s: 'c', e: 't', words: {
      a: { en: 'cat', he: 'חתול', icon: '🐱' },
      o: { en: 'cot', he: 'מיטת תינוק', icon: '🛏️' },
      u: { en: 'cut', he: 'לחתוך', icon: '✂️' } } },
    { s: 'p', e: 'n', words: {
      a: { en: 'pan', he: 'מחבת', icon: '🍳' },
      e: { en: 'pen', he: 'עט', icon: '🖊️' },
      i: { en: 'pin', he: 'סיכה', icon: '📌' } } },
    { s: 'd', e: 'g', words: {
      i: { en: 'dig', he: 'לחפור', icon: '⛏️' },
      o: { en: 'dog', he: 'כלב', icon: '🐶' },
      u: { en: 'dug', he: 'חפר', icon: '🕳️' } } },
    { s: 'b', e: 'd', words: {
      a: { en: 'bad', he: 'רע', icon: '👎' },
      e: { en: 'bed', he: 'מיטה', icon: '🛏️' },
      i: { en: 'bid', he: 'להציע מחיר', icon: '🏷️' } } },
    { s: 's', e: 't', words: {
      a: { en: 'sat', he: 'ישב', icon: '🪑' },
      e: { en: 'set', he: 'סט', icon: '🎯' },
      i: { en: 'sit', he: 'לשבת', icon: '💺' } } },
    { s: 'm', e: 'd', words: {
      a: { en: 'mad', he: 'כועס', icon: '😠' },
      u: { en: 'mud', he: 'בוץ', icon: '🟤' } } },
    { s: 'l', e: 'g', words: {
      e: { en: 'leg', he: 'רגל', icon: '🦵' },
      o: { en: 'log', he: 'בול עץ', icon: '🪵' } } },
    { s: 'n', e: 't', words: {
      e: { en: 'net', he: 'רשת', icon: '🥅' },
      o: { en: 'not', he: 'לא', icon: '🚫' },
      u: { en: 'nut', he: 'אגוז', icon: '🥜' } } },
    { s: 'r', e: 'n', words: {
      a: { en: 'ran', he: 'רץ', icon: '🏃' },
      u: { en: 'run', he: 'לרוץ', icon: '🏃‍♂️' } } },
    { s: 'f', e: 'n', words: {
      a: { en: 'fan', he: 'מאוורר', icon: '🪭' },
      i: { en: 'fin', he: 'סנפיר', icon: '🐟' },
      u: { en: 'fun', he: 'כיף', icon: '🥳' } } },
    { s: 't', e: 'p', words: {
      a: { en: 'tap', he: 'ברז', icon: '🚰' },
      i: { en: 'tip', he: 'טיפ', icon: '💡' },
      o: { en: 'top', he: 'חלק עליון', icon: '🔝' } } },
    { s: 'r', e: 'd', words: {
      e: { en: 'red', he: 'אדום', icon: '🔴' },
      i: { en: 'rid', he: 'להיפטר', icon: '🧹' },
      o: { en: 'rod', he: 'מוט', icon: '🎣' } } },
    { s: 'p', e: 'g', words: {
      e: { en: 'peg', he: 'יתד', icon: '📎' },
      i: { en: 'pig', he: 'חזיר', icon: '🐷' },
      u: { en: 'pug', he: 'כלב פאג', icon: '🐶' } } },
    { s: 'f', e: 'x', words: {
      i: { en: 'fix', he: 'לתקן', icon: '🔧' },
      o: { en: 'fox', he: 'שועל', icon: '🦊' } } },
    { s: 'm', e: 'p', words: {
      a: { en: 'map', he: 'מפה', icon: '🗺️' },
      o: { en: 'mop', he: 'מגב', icon: '🧹' } } },
    { s: 'h', e: 'p', words: {
      i: { en: 'hip', he: 'ירך', icon: '🦴' },
      o: { en: 'hop', he: 'לקפוץ', icon: '🐇' } } },
    { s: 'b', e: 't', words: {
      a: { en: 'bat', he: 'עטלף', icon: '🦇' },
      e: { en: 'bet', he: 'להמר', icon: '🎰' },
